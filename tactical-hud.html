import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';

import {

} from 'lucide-react';

/* ============================================================
   CONFIG / STORAGE
   ============================================================ */
const STORAGE_KEY = 'fos_hud_api_url';
const MOCK_KEY = 'fos_hud_mock_mode';
// Pre-filled with your deployed Apps Script Web App URL — used the first time
// this page loads on a device, before anything has been saved to localStorage.
// Change this if you redeploy to a new /exec URL, or just update it once from
// the in-app Settings modal (gear icon) and it'll persist from then on.
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyjIoOr0-s-QL-5tFa65mdNu6L12CHyTDVPV8NwYXMOkoVqGLS81LiL_3burFOHsfO3/exec';

function getStoredUrl() {
  try { return localStorage.getItem(STORAGE_KEY) || DEFAULT_API_URL; } catch (e) { return DEFAULT_API_URL; }
}
function setStoredUrl(url) {
  try { localStorage.setItem(STORAGE_KEY, url); } catch (e) {}
}
function getMockMode() {
  try { return localStorage.getItem(MOCK_KEY) === '1'; } catch (e) { return false; }
}
function setMockMode(v) {
  try { localStorage.setItem(MOCK_KEY, v ? '1' : '0'); } catch (e) {}
}

/* ============================================================
   MOCK DATA (used when "Force Offline Mock" is on, or as a
   fallback if no API URL has been configured yet)
   ============================================================ */
const MOCK = {
  hours: [
    { name: 'Ravi Shankar', start: '09:12 AM', end: '--', total: '--' },
    { name: 'Priya Nair', start: '08:55 AM', end: '06:02 PM', total: '09:07' },
    { name: 'Arjun Mehta', start: '09:30 AM', end: '--', total: '--' },
    { name: 'Sneha Kulkarni', start: '--', end: '--', total: '--' },
  ],
  visits: [
    { name: 'Ravi Shankar', today: 11, avg: 8.4 },
    { name: 'Priya Nair', today: 6, avg: 9.1 },
    { name: 'Arjun Mehta', today: 14, avg: 10.2 },
    { name: 'Sneha Kulkarni', today: 0, avg: 7.3 },
  ],
  sections: [
    { title: 'Sales Division', rows: [
      { field: 'Merchant Visits', value: 42 },
      { field: 'Orders Closed', value: 18 },
      { field: 'New Accounts', value: 3 },
    ]},
    { title: 'Marketing Operations', rows: [
      { field: 'Displays Audited', value: 27 },
      { field: 'POSM Deployed', value: 12 },
    ]},
    { title: 'Team Summary', rows: [

    ]},

    date: new Date().toISOString().slice(0,10),

      { userId: 'u1', name: 'Ravi Shankar', status: 'P' },

      { userId: 'u3', name: 'Arjun Mehta', status: 'L' },
    ],
    marketingOfficers: [
      { userId: 'u4', name: 'Sneha Kulkarni', status: 'P' },
      { userId: 'u5', name: 'Farah Sheikh', status: 'P' },
    ],
  },
};

/* ============================================================
   API
   ============================================================ */
function useApi() {
  const [apiUrl, setApiUrl] = useState(getStoredUrl());
  const [mock, setMock] = useState(getMockMode());

  const callApi = useCallback(async (action, payload) => {
    if (mock || !apiUrl) {
      await new Promise(r => setTimeout(r, 350));
      if (action === 'getAdminWorkingHours') return { ok: true, rows: MOCK.hours };
      if (action === 'getAdminVisitsCompleted') return { ok: true, rows: MOCK.visits };
      if (action === 'getAdminVisitSummary') return { ok: true, sections: MOCK.sections };
      if (action === 'getAdminAttendance') return { ok: true, ...MOCK.attendance };
      if (action === 'submitAdminAttendance') return { ok: true, count: (payload && payload.records || []).length };
      return { ok: false, message: 'Unknown mock action' };
    }
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload: payload || {} }),
    });
    return res.json();
  }, [apiUrl, mock]);

  const updateApiUrl = useCallback((url) => {
    setApiUrl(url);
    setStoredUrl(url);
  }, []);
  const updateMock = useCallback((v) => {
    setMock(v);
    setMockMode(v);
  }, []);

  return { apiUrl, updateApiUrl, mock, updateMock, callApi };
}

/* ============================================================
   SMALL UI PRIMITIVES
   ============================================================ */
function GlassCard({ children, className = '' }) {
  return (
    <div className={`bg-surface/60 backdrop-blur-xl border border-[#8CAAC8]/15 rounded-2xl ${className}`}>
      {children}
    </div>
  );
}

function StatChip({ label, value, tone = 'cyan' }) {
  const toneMap = {
    cyan: 'text-cyan border-cyan/25 shadow-glow-cyan',
    mint: 'text-mint border-mint/25 shadow-glow-mint',
    amber: 'text-amber border-amber/25 shadow-glow-amber',
    coral: 'text-coral border-coral/25 shadow-glow-coral',
  };
  return (
    <div className={`flex-1 min-w-[100px] rounded-xl border bg-elevated/70 px-4 py-3 ${toneMap[tone]}`}>
      <div className="font-mono tabular text-2xl font-semibold leading-none">{value}</div>
      <div className="mt-1.5 text-[11px] text-[#7C93AC] tracking-wide">{label}</div>
    </div>
  );
}

function Toast({ message, tone = 'mint', onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2600);
    return () => clearTimeout(t);
  }, [onDone]);
  const toneMap = { mint: 'border-mint/40 text-mint', coral: 'border-coral/40 text-coral' };
  return (
    <motion.div
      initial={{ opacity: 0, y: -16, scale: 0.96 }}
      animate={{ opacity: 1, y: 0, scale: 1 }}
      exit={{ opacity: 0, y: -16, scale: 0.96 }}
      transition={{ type: 'spring', stiffness: 400, damping: 28 }}
      className={`fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-elevated/95 backdrop-blur-xl border ${toneMap[tone]} rounded-xl px-4 py-3 shadow-lg flex items-center gap-2 text-sm font-medium`}
    >
      <ShieldCheck size={16} />
      {message}
    </motion.div>
  );
}

/* ============================================================

  { key: 'visits', label: 'VISITS COMPLETED', icon: CheckCircle2 },

/* ============================================================
   1. WORKING HOURS SCREEN
   ============================================================ */
function WorkingHoursScreen({ rows, loading }) {
  const [query, setQuery] = useState('');

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return rows;
    return rows.filter(r => r.name.toLowerCase().includes(q));
  }, [rows, query]);

  const stats = useMemo(() => {
    const active = rows.filter(r => r.start !== '--' && r.end === '--').length;
    const completed = rows.filter(r => r.start !== '--' && r.end !== '--').length;
    const notStarted = rows.filter(r => r.start === '--').length;
    return { active, completed, notStarted };
  }, [rows]);

  return (
    <div className="px-4 py-4 max-w-2xl mx-auto">
      <div className="flex gap-2 mb-4">
        <StatChip label="ACTIVE IN FIELD" value={stats.active} tone="mint" />
        <StatChip label="COMPLETED SHIFT" value={stats.completed} tone="cyan" />
        <StatChip label="NOT STARTED" value={stats.notStarted} tone="amber" />
      </div>

      <div className="relative mb-4">
        <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#4A5A70]" />
        <input
          value={query}
          onChange={e => setQuery(e.target.value)}
          placeholder="Search officers..."
          className="w-full bg-elevated/70 border border-[#8CAAC8]/15 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-[#4A5A70] focus:border-cyan/40 outline-none transition-colors"
        />
      </div>

      {loading ? (
        <SkeletonList rows={4} />
      ) : filtered.length === 0 ? (
        <EmptyState text="No officers match that search." />
      ) : (
        <div className="space-y-2">
          {filtered.map((r, i) => (
            <motion.div
              key={r.name + i}
              initial={{ opacity: 0, y: 6 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ delay: i * 0.03 }}
              whileHover={{ y: -2 }}
              className="group"
            >
              <GlassCard className="px-4 py-3 flex items-center justify-between gap-3 border-[#8CAAC8]/15 group-hover:border-cyan/30 transition-colors">
                <span className="text-sm font-medium text-white truncate">{r.name}</span>
                <div className="flex items-center gap-2 shrink-0">
                  <TimeBadge label="IN" value={r.start} tone="mint" />
                  <TimeBadge label="OUT" value={r.end} tone="coral" />
                  <div className="font-mono tabular text-xs text-cyan bg-cyan/10 border border-cyan/25 rounded-lg px-2 py-1">
                    {r.total}
                  </div>
                </div>
              </GlassCard>
            </motion.div>
          ))}
        </div>
      )}
    </div>
  );
}

function TimeBadge({ label, value, tone }) {
  const toneMap = { mint: 'text-mint bg-mint/10 border-mint/25', coral: 'text-coral bg-coral/10 border-coral/25' };
  return (
    <div className={`hidden xs:flex sm:flex flex-col items-center rounded-lg border px-2 py-1 ${value === '--' ? 'text-[#4A5A70] bg-elevated/60 border-[#8CAAC8]/15' : toneMap[tone]}`}>
      <span className="text-[8px] font-display tracking-wider">{label}</span>
      <span className="font-mono tabular text-[11px]">{value}</span>
    </div>
  );
}

/* ============================================================
   2. VISITS COMPLETED SCREEN
   ============================================================ */
function VisitsScreen({ rows, loading }) {
  return (
    <div className="px-4 py-4 max-w-2xl mx-auto">
      {loading ? (
        <SkeletonList rows={4} />
      ) : rows.length === 0 ? (
        <EmptyState text="No visit data found." />
      ) : (
        <div className="space-y-3">
          {rows.map((r, i) => {
            const delta = r.today - r.avg;
            const ahead = delta >= 0;
            const maxScale = Math.max(r.today, r.avg, 1);
            return (
              <motion.div
                key={r.name + i}
                initial={{ opacity: 0, y: 6 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ delay: i * 0.03 }}
              >
                <GlassCard className="px-4 py-3.5">
                  <div className="flex items-center justify-between mb-2.5">
                    <span className="text-sm font-medium text-white">{r.name}</span>
                    <span className={`text-[11px] font-mono tabular font-semibold px-2 py-0.5 rounded-md border ${ahead ? 'text-mint border-mint/30 bg-mint/10' : 'text-coral border-coral/30 bg-coral/10'}`}>
                      {ahead ? '+' : ''}{delta.toFixed(1)} {ahead ? 'ahead' : 'behind'}
                    </span>
                  </div>

                  <BarRow label="TODAY" value={r.today} max={maxScale} color="from-cyan to-mint" textColor="text-cyan" delay={i * 0.05} />
                  <BarRow label="AVERAGE" value={r.avg} max={maxScale} color="from-[#4A5A70] to-[#7C93AC]" textColor="text-[#7C93AC]" delay={i * 0.05 + 0.1} muted />
                </GlassCard>
              </motion.div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function BarRow({ label, value, max, color, textColor, delay, muted }) {
  const pct = Math.min(100, (value / max) * 100);
  return (
    <div className="flex items-center gap-2.5 mb-1.5 last:mb-0">
      <span className="w-16 shrink-0 text-[9px] font-display tracking-wider text-[#7C93AC]">{label}</span>
      <div className="flex-1 h-2.5 rounded-full bg-elevated overflow-hidden">
        <motion.div
          initial={{ width: 0 }}
          animate={{ width: `${pct}%` }}
          transition={{ duration: 0.7, delay, ease: 'easeOut' }}
          className={`h-full rounded-full bg-gradient-to-r ${color} ${muted ? 'opacity-50' : 'shadow-glow-cyan'}`}
        />
      </div>
      <span className={`w-8 shrink-0 text-right font-mono tabular text-xs font-semibold ${textColor}`}>{value}</span>
    </div>
  );
}

/* ============================================================
   4. ATTENDANCE SCREEN
   ============================================================ */
function AttendanceScreen({ data, loading, onSave, saving }) {
  const [draft, setDraft] = useState(null);

  useEffect(() => {
    if (data) setDraft({ sales: data.salesOfficers, marketing: data.marketingOfficers });
  }, [data]);

  const dirty = useMemo(() => {
    if (!draft || !data) return false;
    const a = [...draft.sales, ...draft.marketing].map(p => p.status).join('');
    const b = [...data.salesOfficers, ...data.marketingOfficers].map(p => p.status).join('');
    return a !== b;
  }, [draft, data]);

  const counts = useMemo(() => {
    if (!draft) return { present: 0, total: 0 };
    const all = [...draft.sales, ...draft.marketing];
    return { present: all.filter(p => p.status !== 'L').length, total: all.length };
  }, [draft]);

  const toggle = (group, idx) => {
    setDraft(prev => {
      const next = { ...prev, [group]: prev[group].map((p, i) => i === idx ? { ...p, status: p.status === 'L' ? 'P' : 'L' } : p) };
      return next;
    });
  };

  const reset = () => data && setDraft({ sales: data.salesOfficers, marketing: data.marketingOfficers });

  if (loading || !draft) return <div className="px-4 py-4 max-w-2xl mx-auto"><SkeletonList rows={4} /></div>;

  return (
    <div className="px-4 py-4 max-w-2xl mx-auto pb-24">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2 text-[#7C93AC]">
          <Calendar size={14} />
          <span className="font-mono tabular text-xs">{data.date}</span>
        </div>
        <div className="font-mono tabular text-sm font-semibold text-mint">
          {counts.present}/{counts.total} <span className="text-[10px] font-display tracking-wider text-[#7C93AC]">PRESENT</span>
        </div>
      </div>

      <AttGroup title="Sales Officers" list={draft.sales} onToggle={idx => toggle('sales', idx)} />
      <AttGroup title="Marketing Officers" list={draft.marketing} onToggle={idx => toggle('marketing', idx)} />

      <AnimatePresence>
        {dirty && (
          <motion.div
            initial={{ y: 80, opacity: 0 }}
            animate={{ y: 0, opacity: 1 }}
            exit={{ y: 80, opacity: 0 }}
            transition={{ type: 'spring', stiffness: 400, damping: 32 }}
            className="fixed bottom-0 left-0 right-0 z-40 bg-elevated/95 backdrop-blur-xl border-t border-cyan/25 px-4 py-3"
          >
            <div className="max-w-2xl mx-auto flex items-center gap-3">
              <button onClick={reset} className="flex items-center gap-1.5 px-3 py-2.5 rounded-lg border border-[#8CAAC8]/20 text-[#7C93AC] text-xs font-medium hover:text-white transition-colors">
                <RotateCcw size={13} /> Reset
              </button>
              <button
                onClick={() => onSave([...draft.sales, ...draft.marketing])}
                disabled={saving}
                className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-gradient-to-r from-cyan to-mint text-canvas text-sm font-display font-semibold tracking-wide shadow-glow-cyan disabled:opacity-60"
              >
                <Save size={14} /> {saving ? 'SAVING...' : 'SAVE ATTENDANCE'}
              </button>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

function AttGroup({ title, list, onToggle }) {
  return (
    <div className="mb-5">
      <h3 className="font-display text-[11px] font-semibold tracking-wider text-[#7C93AC] mb-2">{title.toUpperCase()}</h3>
      {list.length === 0 ? (
        <div className="text-xs text-[#4A5A70] italic px-1">No one listed.</div>
      ) : (
        <div className="space-y-2">
          {list.map((p, idx) => (
            <GlassCard key={p.userId || p.name} className="px-4 py-3 flex items-center justify-between">
              <span className="text-sm text-white truncate">{p.name}</span>
              <div className="flex rounded-lg overflow-hidden border border-[#8CAAC8]/20">
                <motion.button
                  whileTap={{ scale: 0.9 }}
                  onClick={() => onToggle(idx)}
                  className={`px-3.5 py-1.5 text-[11px] font-display font-bold tracking-wide transition-colors ${p.status === 'L' ? 'bg-amber text-canvas shadow-glow-amber' : 'text-[#4A5A70]'}`}
                >
                  L
                </motion.button>
                <motion.button
                  whileTap={{ scale: 0.9 }}
                  onClick={() => onToggle(idx)}
                  className={`px-3.5 py-1.5 text-[11px] font-display font-bold tracking-wide transition-colors ${p.status !== 'L' ? 'bg-mint text-canvas shadow-glow-mint' : 'text-[#4A5A70]'}`}
                >
                  P
                </motion.button>
              </div>
            </GlassCard>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   SETTINGS MODAL
   ============================================================ */
function SettingsModal({ open, onClose, apiUrl, onSaveUrl, mock, onToggleMock, onDiagnose, diagnosis, diagnosing }) {
  const [draftUrl, setDraftUrl] = useState(apiUrl);
  useEffect(() => { setDraftUrl(apiUrl); }, [apiUrl, open]);

  return (
    <AnimatePresence>
      {open && (
        <>
          <motion.div
            initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
            onClick={onClose}
            className="fixed inset-0 z-[90] bg-black/60 backdrop-blur-md"
          />
          <motion.div
            initial={{ opacity: 0, scale: 0.95, y: 10 }}
            animate={{ opacity: 1, scale: 1, y: 0 }}
            exit={{ opacity: 0, scale: 0.95, y: 10 }}
            transition={{ type: 'spring', stiffness: 400, damping: 32 }}
            className="fixed z-[91] inset-x-4 top-1/2 -translate-y-1/2 max-w-md mx-auto bg-elevated border border-[#8CAAC8]/20 rounded-2xl shadow-2xl overflow-hidden"
          >
            <div className="px-5 py-4 border-b border-[#8CAAC8]/15 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <TerminalSquare size={16} className="text-cyan" />
                <h2 className="font-display text-sm font-semibold tracking-wide text-white">CONNECTION SETTINGS</h2>
              </div>
              <button onClick={onClose} className="text-[#7C93AC] hover:text-white"><X size={18} /></button>
            </div>

            <div className="px-5 py-4 space-y-4">
              <div>
                <label className="text-[10px] font-display tracking-wider text-[#7C93AC] mb-1.5 block">GOOGLE APPS SCRIPT WEB APP URL</label>
                <input
                  value={draftUrl}
                  onChange={e => setDraftUrl(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full bg-canvas border border-[#8CAAC8]/20 rounded-lg px-3 py-2.5 text-xs font-mono text-white placeholder-[#4A5A70] focus:border-cyan/40 outline-none"
                />
              </div>

              <div className="flex items-center justify-between rounded-lg border border-[#8CAAC8]/15 px-3 py-2.5">
                <span className="text-xs text-[#DFF6FF]/80">Force Offline Mock</span>
                <button
                  onClick={() => onToggleMock(!mock)}
                  className={`w-10 h-[22px] rounded-full relative transition-colors ${mock ? 'bg-mint' : 'bg-[#4A5A70]/40'}`}
                >
                  <motion.span layout className="absolute top-[2px] w-[18px] h-[18px] rounded-full bg-white shadow" style={{ left: mock ? '20px' : '2px' }} />
                </button>
              </div>

              <button
                onClick={() => onDiagnose(draftUrl)}
                disabled={diagnosing || !draftUrl}
                className="w-full flex items-center justify-center gap-2 rounded-lg border border-cyan/30 text-cyan text-xs font-display font-semibold tracking-wide py-2.5 hover:bg-cyan/10 transition-colors disabled:opacity-50"
              >
                <Wifi size={14} /> {diagnosing ? 'DIAGNOSING...' : 'DIAGNOSE CONNECTION'}
              </button>

              {diagnosis && (
                <div className={`text-xs rounded-lg px-3 py-2 font-mono ${diagnosis.ok ? 'text-mint bg-mint/10 border border-mint/25' : 'text-coral bg-coral/10 border border-coral/25'}`}>
                  {diagnosis.message}
                </div>
              )}
            </div>

            <div className="px-5 py-4 border-t border-[#8CAAC8]/15 flex gap-2">
              <button onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-[#8CAAC8]/20 text-[#7C93AC] text-xs font-medium">Cancel</button>
              <button
                onClick={() => { onSaveUrl(draftUrl); onClose(); }}
                className="flex-1 py-2.5 rounded-lg bg-gradient-to-r from-cyan to-mint text-canvas text-xs font-display font-semibold tracking-wide shadow-glow-cyan"
              >
                Save & Close
              </button>
            </div>
          </motion.div>
        </>
      )}
    </AnimatePresence>
  );
}

/* ============================================================
   SHARED: SKELETONS / EMPTY STATE
   ============================================================ */
function SkeletonList({ rows = 3, tall = false }) {
  return (
    <div className="space-y-2">
      {Array.from({ length: rows }).map((_, i) => (
        <div key={i} className={`rounded-2xl bg-surface/60 border border-[#8CAAC8]/10 animate-pulse ${tall ? 'h-24' : 'h-16'}`} />
      ))}
    </div>
  );
}

function EmptyState({ text }) {
  return (
    <div className="flex flex-col items-center justify-center py-16 text-center">
      <div className="w-12 h-12 rounded-full border border-[#8CAAC8]/20 flex items-center justify-center mb-3">
        <Radar size={20} className="text-[#4A5A70]" />
      </div>
      <p className="text-sm text-[#7C93AC] max-w-[220px]">{text}</p>
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */
function App() {
  const { apiUrl, updateApiUrl, mock, updateMock, callApi } = useApi();
  const [tab, setTab] = useState('hours');
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const [lastSynced, setLastSynced] = useState('--:--:--');
  const [toast, setToast] = useState(null);
  const [diagnosis, setDiagnosis] = useState(null);
  const [diagnosing, setDiagnosing] = useState(false);

  const [hoursData, setHoursData] = useState([]);
  const [visitsData, setVisitsData] = useState([]);
  const [summaryData, setSummaryData] = useState([]);
  const [attData, setAttData] = useState(null);
  const [loading, setLoading] = useState({ hours: true, visits: true, summary: true, attendance: true });
  const [saving, setSaving] = useState(false);

  const live = mock || !!apiUrl;

  const loadAll = useCallback(async () => {
    setRefreshing(true);
    setLoading({ hours: true, visits: true, summary: true, attendance: true });
    try {
      const [h, v, s, a] = await Promise.all([
        callApi('getAdminWorkingHours'),
        callApi('getAdminVisitsCompleted'),
        callApi('getAdminVisitSummary'),
        callApi('getAdminAttendance'),
      ]);
      if (h.ok) setHoursData(h.rows || []);
      if (v.ok) setVisitsData(v.rows || []);
      if (s.ok) setSummaryData(s.sections || []);
      if (a.ok) setAttData({ date: a.date, salesOfficers: a.salesOfficers || [], marketingOfficers: a.marketingOfficers || [] });
      setLastSynced(new Date().toLocaleTimeString('en-US', { hour12: false }));
    } catch (e) {
      setToast({ message: 'Sync failed — check connection settings.', tone: 'coral' });
    } finally {
      setLoading({ hours: false, visits: false, summary: false, attendance: false });
      setTimeout(() => setRefreshing(false), 600);
    }
  }, [callApi]);

  useEffect(() => { loadAll(); }, [loadAll]);

  const handleSaveAttendance = async (records) => {
    setSaving(true);
    try {
      const res = await callApi('submitAdminAttendance', { records });
      if (res.ok) {
        setAttData(prev => ({ ...prev, salesOfficers: records.filter(r => prev.salesOfficers.some(p => p.userId === r.userId)), marketingOfficers: records.filter(r => prev.marketingOfficers.some(p => p.userId === r.userId)) }));
        setToast({ message: 'Attendance saved successfully.', tone: 'mint' });
      } else {
        setToast({ message: res.message || 'Save failed.', tone: 'coral' });
      }
    } catch (e) {
      setToast({ message: 'Save failed — network error.', tone: 'coral' });
    } finally {
      setSaving(false);
    }
  };

  const handleDiagnose = async (url) => {
    setDiagnosing(true);
    setDiagnosis(null);
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getAdminWorkingHours', payload: {} }),
      });
      const json = await res.json();
      setDiagnosis(json.ok
        ? { ok: true, message: `Connected. ${(json.rows || []).length} row(s) returned.` }
        : { ok: false, message: `Reached backend, but: ${json.message || 'unknown error'}` });
    } catch (e) {
      setDiagnosis({ ok: false, message: 'Could not reach that URL (CORS, network, or deployment access issue).' });
    } finally {
      setDiagnosing(false);
    }
  };

  return (
    <div className="min-h-screen bg-hud-radial">
      <TopBar live={live} lastSynced={lastSynced} onRefresh={loadAll} refreshing={refreshing} onOpenSettings={() => setSettingsOpen(true)} />
      <NavTabs active={tab} onChange={setTab} />

      <main>
        {tab === 'hours' && <WorkingHoursScreen rows={hoursData} loading={loading.hours} />}
        {tab === 'visits' && <VisitsScreen rows={visitsData} loading={loading.visits} />}
        {tab === 'summary' && <SummaryScreen sections={summaryData} loading={loading.summary} />}
        {tab === 'attendance' && <AttendanceScreen data={attData} loading={loading.attendance} onSave={handleSaveAttendance} saving={saving} />}
      </main>

      <SettingsModal
        open={settingsOpen}
        onClose={() => setSettingsOpen(false)}
        apiUrl={apiUrl}
        onSaveUrl={updateApiUrl}
        mock={mock}
        onToggleMock={updateMock}
        onDiagnose={handleDiagnose}
        diagnosis={diagnosis}
        diagnosing={diagnosing}
      />

      <AnimatePresence>
        {toast && <Toast key={toast.message} message={toast.message} tone={toast.tone} onDone={() => setToast(null)} />}
      </AnimatePresence>
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
