<style>
  html, body { background: #050810; }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(140,170,200,0.25); border-radius: 4px; }
  .bg-hud-radial {
    background-image: radial-gradient(circle at 50% -20%, rgba(34,229,255,0.08), transparent 70%);
  }
  .tabular { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid #22E5FF; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* Boot spinner — adapted from Uiverse.io by Chriskoziol, restyled to the
     Tactical HUD palette (cyan/mint on canvas) and Chakra Petch type. */
  .spinnerContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .spinner {
    width: 56px;
    height: 56px;
    display: grid;
