  /* ===================== UNIFIED LIGHTING SYSTEM =====================
     ONE light source, top-left (~135deg). Every raised surface casts a soft
     shadow DOWN-RIGHT and catches a highlight UP-LEFT; every recessed surface
     is the exact inverse. Only 3 raise levels + 1 press level exist, each with
     proportional offset/blur, so no tile is deeper, blurrier or differently
     lit than another.
       raise-1  small controls (buttons, chips, avatars, toast pill)
       raise-2  cards (== raise-1, one shared level)
       raise-3  modals (highest, closest to the light)
       press-1  recessed: inputs, data tiles, selected toggles, pressed buttons */
  :root {
    --shade:104,84,64; --lit:255,255,255;
    /* UNIFORM: cards, stat chips, buttons, pills all share ONE elevation; pressed = one soft inset */
    --raise-0: 2px 2px 5px rgba(var(--shade),.14), -2px -2px 5px rgba(var(--lit),.80);
    --raise-1: 4px 4px 10px rgba(var(--shade),.15), -3px -3px 8px rgba(var(--lit),.80);
    --raise-2: var(--raise-1);
    --raise-3: 10px 10px 22px rgba(var(--shade),.20), -6px -6px 16px rgba(var(--lit),.85);
    --press-1: inset 2px 2px 5px rgba(var(--shade),.16), inset -2px -2px 5px rgba(var(--lit),.80);
    --edge: inset 1px 1px 1px rgba(var(--lit),.9);
    --glass: linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.40));
    --tile: rgba(120,100,80,.07);   /* flat translucent tint for tiles nested inside cards */
    --surface:#F3F0EC; --recess:#EAE6E1;
  }
  /* neutralise every legacy glow / ad-hoc shadow utility so only the system above applies */
  .shadow, .shadow-lg { box-shadow:var(--raise-2) !important; }
  .shadow-2xl { box-shadow:var(--raise-3) !important; }
  .shadow-glow-cyan, .shadow-glow-mint, .shadow-glow-amber, .shadow-glow-coral { box-shadow:none !important; }

  /* ---- cards (single elevation for ALL cards, incl. ones with legacy cyan hover borders) ---- */
  .glass-card { background:var(--glass);
    border:1px solid rgba(255,255,255,.80) !important; border-radius:20px;
    box-shadow:var(--raise-2), var(--edge) !important; }
  /* loading skeletons use the same silhouette so nothing jumps when data arrives */
  .animate-pulse { background:var(--glass) !important;
    border:1px solid rgba(255,255,255,.80) !important; border-radius:20px !important; box-shadow:var(--raise-2), var(--edge); }

  /* ---- tiles ---- */
  .rounded-xl[class*="bg-elevated/70"] { background:var(--glass) !important; border:1px solid rgba(255,255,255,.80) !important; box-shadow:var(--raise-1), var(--edge) !important; }   /* stat chips: same glass + elevation as cards */
  .rounded-lg[class*="bg-elevated/70"], div.rounded-lg[class*="bg-elevated/50"] { background:var(--tile) !important; border:1px solid rgba(255,255,255,.55) !important; box-shadow:none !important; }  /* nested data tiles / report rows: flat, translucent, not embossed */
  .text-\[8px\] { font-size:9px; } .text-\[9px\] { font-size:10px; } .text-\[10px\] { font-size:11px; } .text-\[11px\] { font-size:12px; }

  /* ---- top bar + bottom nav: same light, no blur ---- */
  header.sticky { background:linear-gradient(180deg,#FBF9F7,#F4F1ED) !important;
    border-bottom:1px solid rgba(255,255,255,.95) !important; box-shadow:0 4px 10px rgba(var(--shade),.12);
    padding-top:env(safe-area-inset-top,0px); }
  /* the nav sits at the bottom edge: light falls from above, so it gets a lit top edge, never an upward shadow */
  nav.fixed { background:linear-gradient(180deg,#F8F6F3,#F1EEEA) !important;
    border-top:1px solid rgba(255,255,255,.95) !important; box-shadow:0 -1px 0 rgba(var(--shade),.07); }
  /* attendance save bar floats over the nav -> shadow falls down onto it */
  .fixed.z-40.bg-elevated { background:linear-gradient(180deg,#FBF9F7,#F4F1ED) !important;
    border-top:1px solid rgba(255,255,255,.95) !important; box-shadow:0 4px 10px rgba(var(--shade),.12); }

  /* ---- inputs: recessed ---- */
  input:not([type=checkbox]):not([type=radio]), textarea, select {
    background:var(--recess) !important; border:1px solid rgba(255,255,255,.75) !important; border-radius:12px; color:#2B2521;
    box-shadow:var(--press-1); }
  input:focus, textarea:focus, select:focus { outline:none; border-color:rgba(120,100,80,.32) !important; }

  /* ---- buttons: all raised-1; selected / pressed = press-1 ---- */
  button.bg-gradient-to-r, button[class*="border-cyan/"], button[class*="bg-elevated/"], button[class*="border-[#8CAAC8]/20"] {

    box-shadow:var(--raise-1), var(--edge) !important; }
  button.bg-gradient-to-r { color:#C8141A; }

  .bg-coral.text-canvas, .bg-mint.text-canvas, .bg-amber.text-canvas { box-shadow:none !important; color:#fff !important; }
  .bg-coral.text-canvas { background-color:#E5352B !important; }
  .bg-mint.text-canvas { background-color:#16A34A !important; }
  .bg-amber.text-canvas { background-color:#E58A00 !important; }
  .flex.rounded-lg.overflow-hidden[class*="border-"] { border-color:rgba(120,100,80,.14) !important; background:rgba(255,255,255,.35); }
  /* avatars */
  [class*="rounded-full"][class*="bg-cyan/10"] { border-color:transparent !important; box-shadow:var(--raise-0) !important; }

  /* ---- toast / pull-to-refresh pill ---- */
  .fixed.z-\[100\] { background-color:var(--surface) !important; box-shadow:var(--raise-1) !important; border-color:rgba(255,255,255,.80) !important; }
  .ptr-pill { padding:7px 16px; border-radius:999px; background:var(--glass), var(--surface); color:#C8141A;
    font:600 10px/1 "Chakra Petch",system-ui,sans-serif; letter-spacing:.14em; box-shadow:var(--raise-1); }

  /* ---- mobile polish ---- */
  @supports (-webkit-touch-callout:none) { input, select, textarea { font-size:16px !important; } }   /* stops iOS zooming the page on focus */
  @supports (height:100dvh) { .z-\[91\].flex-col { max-height:85dvh !important; } }
  .app-shell { animation:shell-in .28s ease-out both; }
  @keyframes shell-in { from { opacity:0; } to { opacity:1; } }

  :focus-visible { outline: 2px solid #FBCE07; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* Boot loader — Shell red (#DD1D21) spinner + cycling word. */
  .boot-screen { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; padding:0 24px; }
  .spinnerContainer { display:flex; flex-direction:column; align-items:center; gap:22px; }
  .spinner { width:56px; height:56px; display:grid; border:4px solid transparent; border-radius:50%;
    border-right-color:#DD1D21; animation:tri-spinner 1s infinite linear; will-change:transform; }
  .spinner::before, .spinner::after { content:""; grid-area:1/1; margin:2px; border:inherit; border-radius:50%; animation:tri-spinner 2s infinite; }
  .spinner::after { margin:8px; animation-duration:3s; border-right-color:#DD1D21; }
  @keyframes tri-spinner { 100% { transform:rotate(1turn); } }
  .loader { color:#40372F; font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:15px; letter-spacing:.12em;
    text-transform:uppercase; box-sizing:content-box; height:22px; display:flex; align-items:center; }
  .words { overflow:hidden; height:100%; }
  .word { display:block; height:100%; line-height:22px; padding-left:8px; color:#DD1D21; animation:cycle-words 6s ease-in-out infinite; }
  /* 5 words + a repeat of the first at the end, so the loop restarts with no visible jump */
  @keyframes cycle-words {
    0%,14%  { transform:translateY(0); }
    20%,34% { transform:translateY(-100%); }
    40%,54% { transform:translateY(-200%); }
    60%,74% { transform:translateY(-300%); }
    80%,94% { transform:translateY(-400%); }
    100%    { transform:translateY(-500%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner, .spinner::before, .spinner::after, .word { animation:none; }
  }
